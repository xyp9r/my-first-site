			<nav>

		<div class="contact-container">
			<h1>Contact Me</h1>
			
			<p>Have a job offer or a question? Write to me, let's discuss!</p>

			<div class="social-links">
				<a href="https://t.me/fuck4g" target="_blank" class="social-btn telegram">Telegram</a>
				<a href="https://github.com/xyp9r" target="_blank" class="social-btn github">GitHub</a>

			</div>

			<form action="https://formspree.io/f/meeergzw" method="POST" class="contact-form">

				<div class="form-group">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" placeholder="How should I call you?" required>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="Your Email" required>
				</div>

				<div class="form-group">
					<label for="message">Message</label>
					<textarea id="message" name="message" placeholder="Your message" required></textarea>
				</div>

				<button type="submit" class="btn">Send Message</button>
			</form>
		</div>
