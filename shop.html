<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Shop</title>
    <link rel="icon" type="image/png" href="img/foto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="shop-header">
        <a href="shop.html" class="logo">SNEAKERS</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html" id="cart-count">Cart (0)</a>
        </nav>
    </header>

    <section class="shop-container">
        <h1>Popular Models</h1>
        
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Nike Air Max">
                <h3>Nike Air Max</h3>
                <p>A classic for running and life.</p>
                <div class="price">12 000 UAH</div>
                <select class="size-select">
                    <option value = "40">EU 40</option>
                    <option value = "41">EU 41</option>
                    <option value = "42">EU 42</option>
                    <option value = "43">EU 43</option>
                    <option value = "44">EU 44</option>
                </select>
                <button>Add to Cart</button>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" alt="Adidas Yeezy">
                <h3>Adidas Yeezy</h3>
                <p>Style from Kanye West.</p>
                <div class="price">18 500 UAH</div>
                <select class="size-select">
                    <option value = "40">EU 40</option>
                    <option value = "41">EU 41</option>
                    <option value = "42">EU 42</option>
                    <option value = "43">EU 43</option>
                    <option value = "44">EU 44</option>
                </select>
                <button>Add to Cart</button>
            </div>
            
             </div>
    </section>

    <button id="theme-btn">☀️</button>

    <footer>© 2026 Ivan Sirenko. All rights reserved.</footer>
    
    <script src="js/shop.js"></script>
   <script src="js/light-theme.js"></script>
</body>
</html>
